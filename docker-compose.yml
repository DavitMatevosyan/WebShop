# in the future when we dockerize the Cart and Catalog Services, the configuration will be added here.
# any setups required or modified also will be added in here.
# no manual creation of topics or exchanges (from code) will be done.

services:
  catalog-service:
    build: ./CatalogService
    ports: 
      - "5149:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - RABBITMQ_HOST=rabbitmq
      - KEYCLOAK_URL=http://keycloak:8080
    depends_on:
      rabbitmq:
        condition: service_started
      keycloak:
        condition: service_started
      sql_server:
        condition: service_started

  cart-service:
    build: ./CatalogService
    ports: 
      - "5150:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - RABBITMQ_HOST=rabbitmq
      - KEYCLOAK_URL=http://keycloak:8080
    depends_on:
      rabbitmq:
        condition: service_started
      keycloak:
        condition: service_started
      sql_server:
        condition: service_started
      


  rabbitmq:
    image: rabbitmq:4-management
    container_name: rabbitmq
    ports:
      - "5672:5672"     # AMQP protocol
      - "15672:15672"   # Management UI
    environment:
      RABBITMQ_DEFAULT_USER: davit
      RABBITMQ_DEFAULT_PASS: davit
    hostname: rabbit

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.3
    container_name: keycloak
    hostname: keycloak
    command: start-dev
    ports:
      - "8080:8080"
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
    # volumes:
    #   - ./conf:/opt/keycloak
    
  sql_server:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    container_name: sql_server
    hostname: sql_server
    ports:
      - "1433:1433"
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "DavSQL123@"
    volumes:
      - sql_data:/var/opt/mssql
    restart: unless-stopped

volumes:
  sql_data:
